<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Will you go out with me?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative layer: floating hearts, sparkles, confetti -->
  <div class="effects" id="effects" aria-hidden="true"></div>

  <main class="stage">
    <section class="card" id="card">
      <svg class="hero-heart" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.9 1.1 5.6 3.2 1.7-2.1 3.5-3.2 5.6-3.2 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z"/>
      </svg>

      <h1 id="message">Will you go out with me?</h1>
      <p class="sub" id="subMessage" hidden>AYIEEEEEEE!</p>

      <div class="buttons" id="buttons">
        <button type="button" class="btn btn-yes" id="yesButton">Yes</button>
        <button type="button" class="btn btn-no" id="noButton">No</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
